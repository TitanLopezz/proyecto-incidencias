services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: incidencias
      POSTGRES_USER: incidencias
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?Define LAB_DB_PASSWORD}
    ports:
      - "${DB_PRIVATE_IP:?Indica la IP privada de la EC2 de base de datos}:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "incidencias", "-d", "incidencias"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
